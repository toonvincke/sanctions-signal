name: SS-022 validation
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/ss-022-seed.ts'
      - 'drizzle/migrations/**'
      - 'package.json'
      - 'bun.lock*'
      - '.github/workflows/ss-022-ci.yml'
  push:
    branches:
      - feature/ss-022-programme-document-model
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - name: Generate catalogue SQL
        run: |
          bun run scripts/ss-022-seed.ts > /tmp/ss-022-seed.sql
          test -s /tmp/ss-022-seed.sql
          grep -q 'INSERT INTO public.sanctions_programmes' /tmp/ss-022-seed.sql
