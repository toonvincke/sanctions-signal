name: SS-022 validation
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/ss-022-seed.ts'
      - 'scripts/ss-024-*.ts'
      - 'scripts/ss-024-*.sql'
      - 'drizzle/migrations/**'
      - 'package.json'
      - 'bun.lock*'
      - '.github/workflows/ss-022-ci.yml'
  push:
    branches:
      - feature/ss-022-programme-document-model
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Repository lint (baseline debt tracked in #41)
        run: bun run lint
        continue-on-error: true
      - run: bun run test
        if: always()
      - run: bun run build
        if: always()
      - name: Generate catalogue SQL
        if: always()
        run: |
          bun run scripts/ss-022-seed.ts > /tmp/ss-022-seed.sql
          test -s /tmp/ss-022-seed.sql
          grep -q 'INSERT INTO public.sanctions_programmes' /tmp/ss-022-seed.sql

      - name: Validate SS-024 mapping inventory and deduplication
        if: always()
        run: |
          bun run scripts/ss-024-curated-sources.ts --json > /tmp/ss024-catalogue.json
          bun run scripts/ss-024-curated-sources.ts --sql > /tmp/ss024-backfill.sql
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ss024-catalogue.json'))
          assert d['total'] == 99, 'Catalogue count changed; review source mappings'
          keys=[(p['jurisdiction'],p['slug']) for p in d['programmes']]
          assert len(keys)==len(set(keys)), 'Programme keys are not unique'
          assert sum(d['counts'].values())==len(keys), 'Coverage count inconsistent'
          assert d['counts']['mapped'] >= 70, 'Previously verified programme mappings missing'
          assert all((p['url'] or '').startswith('https://') for p in d['programmes'] if p['status']=='mapped')
          print('Verified source mapping inventory:', d['counts'])
          PY
