name: Stripe billing validation

on:
  pull_request:
    paths:
      - "src/lib/stripe-*"
      - "src/lib/subscription-plans*"
      - "src/routes/pricing.tsx"
      - "supabase/functions/**"
      - "drizzle/migrations/0025_stripe_billing_events.sql"
      - ".github/workflows/stripe-billing-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stripe-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run Stripe unit tests
        run: bunx vitest run src/lib/stripe-billing-config.test.ts src/lib/stripe-api.server.test.ts src/lib/stripe-webhook.server.test.ts src/lib/subscription-plans.test.ts src/lib/stripe-edge-signature.test.ts
