name: Monitoring parser and database tests
on:
  pull_request:
    paths:
      - "supabase/functions/_shared/**"
      - "supabase/functions/sanctions-sync/**"
      - "supabase/functions/intelligence-discover/**"
      - "supabase/functions/candidate-review/**"
      - "drizzle/migrations/0023*"
      - "drizzle/migrations/0024*"
      - "scripts/ss-023-staging-smoke.sql"
      - "supabase/functions/assistant/**"
      - "drizzle/migrations/0006*"
      - "drizzle/migrations/0008*"
      - "drizzle/migrations/0009*"
      - "drizzle/migrations/0010*"
      - "drizzle/migrations/0011*"
      - "supabase/tests/**"
      - "tests/sql/**"
      - ".github/workflows/monitoring-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run parser tests
        run: node --experimental-strip-types --test supabase/functions/_shared/sanctions-parsers.test.mjs

  xml-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check XML parser
        run: deno check --node-modules-dir=auto supabase/functions/_shared/xml-feeds.ts
      - name: Test UN XML and RSS/Atom parsing
        run: deno test --node-modules-dir=auto supabase/functions/_shared/xml-feeds.test.ts

  database-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Verify transaction and permission controls
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f tests/sql/monitoring_atomic_snapshot.sql

  openai-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run OpenAI parsing, validation and mocked HTTP integration tests
        run: deno test --node-modules-dir=auto supabase/functions/_shared/openai-response.test.ts supabase/functions/_shared/intelligence-draft.test.ts supabase/functions/_shared/openai-client.test.ts
      - name: Type-check changed Edge Functions
        run: deno check --node-modules-dir=auto supabase/functions/assistant/index.ts supabase/functions/intelligence-discover/index.ts supabase/functions/candidate-review/index.ts

  premium-rls-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Execute premium entitlement, draft visibility and least-privilege SQL integration tests
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f tests/sql/ss025_paywall_rls.sql

  publication-integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Verify SS-023/SS-024 migrations, editorial state transitions and RLS
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f tests/sql/ss018_publication_integration.sql
