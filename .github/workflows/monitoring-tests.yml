name: Monitoring parser and database tests
on:
  pull_request:
    paths:
      - "supabase/functions/_shared/**"
      - "supabase/functions/sanctions-sync/**"
      - "drizzle/migrations/0006*"
      - "tests/sql/**"
      - ".github/workflows/monitoring-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run parser tests
        run: node --experimental-strip-types --test supabase/functions/_shared/sanctions-parsers.test.mjs

  database-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Verify transaction and permission controls
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f tests/sql/monitoring_atomic_snapshot.sql
