# Local development label, NOT a production project reference.
# Deploy only to the existing Lovable Cloud backend after explicit verification.
project_id = "sanctions-signal-local"

# Scheduled endpoints validate their own dedicated SANCTIONS_CRON_SECRET.
# The hosting gateway must allow requests to reach that check.
[functions.sanctions-sync]
verify_jwt = false

[functions.intelligence-discover]
verify_jwt = false

# Dedicated cron-bearer authentication is enforced inside this endpoint.
[functions.official-source-check]
verify_jwt = false

# Stripe signs webhook requests itself; verify raw-body signature in the handler.
[functions.stripe-webhook]
verify_jwt = false
